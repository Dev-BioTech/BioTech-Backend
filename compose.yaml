services:
  auth-service:
    build:
      context: .
      dockerfile: AuthService.Presentation/Dockerfile
    ports:
      - "5001:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - POSTGRESQL_ADDON_URI=${AUTH_SERVICE_DB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
    networks:
      - biotech-network

  feeding-service:
    build:
      context: .
      dockerfile: FeedingService.Presentation/Dockerfile
    ports:
      - "5114:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - POSTGRESQL_ADDON_URI=${FEEDING_SERVICE_DB_URI}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - biotech-network

  reproduction-service:
    build:
      context: .
      dockerfile: ReproductionService.Presentation/Dockerfile
    ports:
      - "5200:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - POSTGRESQL_ADDON_URI=${REPRODUCTION_SERVICE_DB_URI}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - biotech-network

  herd-service:
    build:
      context: .
      dockerfile: HerdService.Presentation/Dockerfile
    ports:
      - "5300:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - POSTGRESQL_ADDON_URI=${HERD_SERVICE_DB_URI}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
    networks:
      - biotech-network

  health-service:
    build:
      context: .
      dockerfile: HealthService.Presentation/Dockerfile
    ports:
      - "5400:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - POSTGRESQL_ADDON_URI=${HEALTH_SERVICE_DB_URI}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
    networks:
      - biotech-network

  ai-service:
    build:
      context: .
      dockerfile: AIService.Presentation/Dockerfile
    ports:
      - "5500:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - AnthropicApi__ApiKey=${ANTHROPIC_API_KEY}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - ServiceUrls__HerdService=http://herd-service:8080
      - ServiceUrls__HealthService=http://health-service:8080
      - ServiceUrls__FeedingService=http://feeding-service:8080
    networks:
      - biotech-network

  commercial-service:
    build:
      context: .
      dockerfile: CommercialService.Presentation/Dockerfile
    ports:
      - "5600:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - POSTGRESQL_ADDON_URI=${COMMERCIAL_SERVICE_DB_URI}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    networks:
      - biotech-network

  inventory-service:
    build:
      context: .
      dockerfile: InventoryService.Presentation/Dockerfile
    ports:
      - "5700:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - POSTGRESQL_ADDON_URI=${INVENTORY_SERVICE_DB_URI}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - biotech-network

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateWay/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - AUTH_SERVICE_HOST=auth-service
      - FEEDING_SERVICE_HOST=feeding-service
      - HEALTH_SERVICE_HOST=health-service
    depends_on:
      auth-service:
        condition: service_started
      feeding-service:
        condition: service_started
      herd-service:
        condition: service_started
      health-service:
        condition: service_started
      reproduction-service:
        condition: service_started
      commercial-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - biotech-network

networks:
  biotech-network:
    driver: bridge

volumes:
  postgres_data:
