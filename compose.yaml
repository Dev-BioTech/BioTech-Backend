services:

  auth-service:
    build:
      context: .
      dockerfile: AuthService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - AUTH_DB_HOST=${AUTH_DB_HOST}
      - AUTH_DB_PORT=${AUTH_DB_PORT}
      - AUTH_DB_NAME=${AUTH_DB_NAME}
      - AUTH_DB_USER=${AUTH_DB_USER}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
    networks:
      - biotech-network

  commercial-service:
    build:
      context: .
      dockerfile: CommercialService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - COMMERCIAL_DB_HOST=${COMMERCIAL_DB_HOST}
      - COMMERCIAL_DB_PORT=${COMMERCIAL_DB_PORT}
      - COMMERCIAL_DB_NAME=${COMMERCIAL_DB_NAME}
      - COMMERCIAL_DB_USER=${COMMERCIAL_DB_USER}
      - COMMERCIAL_DB_PASSWORD=${COMMERCIAL_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
    networks:
      - biotech-network

  feeding-service:
    build:
      context: .
      dockerfile: FeedingService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - FEEDING_DB_HOST=${FEEDING_DB_HOST}
      - FEEDING_DB_PORT=${FEEDING_DB_PORT}
      - FEEDING_DB_NAME=${FEEDING_DB_NAME}
      - FEEDING_DB_USER=${FEEDING_DB_USER}
      - FEEDING_DB_PASSWORD=${FEEDING_DB_PASSWORD}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    networks:
      - biotech-network

  health-service:
    build:
      context: .
      dockerfile: HealthService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - HEALTH_DB_HOST=${HEALTH_DB_HOST}
      - HEALTH_DB_PORT=${HEALTH_DB_PORT}
      - HEALTH_DB_NAME=${HEALTH_DB_NAME}
      - HEALTH_DB_USER=${HEALTH_DB_USER}
      - HEALTH_DB_PASSWORD=${HEALTH_DB_PASSWORD}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    networks:
      - biotech-network

  herd-service:
    build:
      context: .
      dockerfile: HerdService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - HERD_DB_HOST=${HERD_DB_HOST}
      - HERD_DB_PORT=${HERD_DB_PORT}
      - HERD_DB_NAME=${HERD_DB_NAME}
      - HERD_DB_USER=${HERD_DB_USER}
      - HERD_DB_PASSWORD=${HERD_DB_PASSWORD}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    networks:
      - biotech-network

  inventory-service:
    build:
      context: .
      dockerfile: InventoryService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - INVENTORY_DB_HOST=${INVENTORY_DB_HOST}
      - INVENTORY_DB_PORT=${INVENTORY_DB_PORT}
      - INVENTORY_DB_NAME=${INVENTORY_DB_NAME}
      - INVENTORY_DB_USER=${INVENTORY_DB_USER}
      - INVENTORY_DB_PASSWORD=${INVENTORY_DB_PASSWORD}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    networks:
      - biotech-network

  reproduction-service:
    build:
      context: .
      dockerfile: ReproductionService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - REPRODUCTION_DB_HOST=${REPRODUCTION_DB_HOST}
      - REPRODUCTION_DB_PORT=${REPRODUCTION_DB_PORT}
      - REPRODUCTION_DB_NAME=${REPRODUCTION_DB_NAME}
      - REPRODUCTION_DB_USER=${REPRODUCTION_DB_USER}
      - REPRODUCTION_DB_PASSWORD=${REPRODUCTION_DB_PASSWORD}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    networks:
      - biotech-network

  ai-service:
    build:
      context: .
      dockerfile: AIService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - AI_DB_HOST=${AI_DB_HOST}
      - AI_DB_PORT=${AI_DB_PORT}
      - AI_DB_NAME=${AI_DB_NAME}
      - AI_DB_USER=${AI_DB_USER}
      - AI_DB_PASSWORD=${AI_DB_PASSWORD}
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - AnthropicApi__ApiKey=${ANTHROPIC_API_KEY}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - ServiceUrls__HerdService=http://herd-service:8080
      - ServiceUrls__HealthService=http://health-service:8080
      - ServiceUrls__FeedingService=http://feeding-service:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - biotech-network

  sales-service:
    build:
      context: .
      dockerfile: SalesService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - SALES_DB_HOST=${SALES_DB_HOST}
      - SALES_DB_PORT=${SALES_DB_PORT}
      - SALES_DB_NAME=${SALES_DB_NAME}
      - SALES_DB_USER=${SALES_DB_USER}
      - SALES_DB_PASSWORD=${SALES_DB_PASSWORD}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    networks:
      - biotech-network

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateWay/Dockerfile
    ports:
      - "5000:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_PORT=8080
      - FEEDING_SERVICE_HOST=feeding-service
      - FEEDING_SERVICE_PORT=8080
      - HEALTH_SERVICE_HOST=health-service
      - HEALTH_SERVICE_PORT=8080
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JwtConfig__Secret=${JWT_SECRET}
      - JwtConfig__Issuer=${JWT_ISSUER}
      - JwtConfig__Audience=${JWT_AUDIENCE}
    depends_on:
      auth-service:
        condition: service_started
      feeding-service:
        condition: service_started
      herd-service:
        condition: service_started
      health-service:
        condition: service_started
      reproduction-service:
        condition: service_started
      commercial-service:
        condition: service_started
      inventory-service:
        condition: service_started
      sales-service:
        condition: service_started
    networks:
      - biotech-network

networks:
  biotech-network:
    driver: bridge
